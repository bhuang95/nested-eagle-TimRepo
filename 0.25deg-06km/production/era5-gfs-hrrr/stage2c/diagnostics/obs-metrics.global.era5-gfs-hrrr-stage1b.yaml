# obs-metrics for the ERA5-pretrained stage1b global model inference.
# Unlike the stage2* nested runs, this forecast is a plain global lat/lon grid
# written straight out of anemoi-inference, so:
#   model_type: global -> no lam_index, no lcc_info, no forecast_regrid_kwargs,
#                         and no anemoi_reference_dataset_kwargs.
# Only one pass per stage (there is no LAM/hrrr pass for these).
forecast_path: /pscratch/sd/b/bhuang95/nested-eagle/0.25deg-06km/production/era5-gfs-hrrr/stage2c/diagnostics/inference-era5-gfs-hrrr-stage1b/
output_path: /pscratch/sd/b/bhuang95/nested-eagle/0.25deg-06km/production/era5-gfs-hrrr/stage2c/diagnostics/inference-era5-gfs-hrrr-stage1b/obs-metrics/
log_path: eagle-logs/obs_metrics/global-era5-gfs-hrrr-stage1b
lead_time: 360
use_mpi: True

model_type: global

# ERA5 (GCS style) variable names, as written by anemoi-inference. rename.yaml
# maps these to the registry's common names ("GCS ERA5 Style" block).
# Deliberately omitted, because this checkpoint cannot produce them:
#   gh   -> the file has geopotential (m2/s2); the obs registry wants
#           geopotential_height and the tool has no conversion -> ValueError
#   sh2  -> no 2m specific humidity / dewpoint variable in the output
vars_of_interest:
  - temperature
  - specific_humidity
  - u_component_of_wind
  - v_component_of_wind
  - surface_pressure
  - 2m_temperature
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
  # quantities that obs-metrics can derive
  - wind_speed
  - 10m_wind_speed

levels:
  - 100
  - 250
  - 500
  - 850

temporal_window: 30min
max_qc_value: 2

subregions:
  conus:
    longitude: [225, 310]
    latitude: [20, 55]
  europe:
    longitude: [-25, 65]
    latitude: [35, 75]
  tropics:
    latitude: [-20, 20]
  northern_hemisphere:
    latitude: [20, 80]
  southern_hemisphere:
    latitude: [-80, -20]
  polar_north:
    latitude: [60, 90]
  polar_south:
    latitude: [-90, -60]

# must match inference.era5-gfs-hrrr-stage1b.yaml (113 initializations),
# and is the same period as the stage2a/2b/2c configs
start_date: 2017-02-01T06
end_date: 2018-01-31T18
freq: 78h
